name: ci-container

on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    # 03:00 Europe/Kyiv == 00:00 UTC, every day
    - cron: '0 0 * * *'

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose

  build:
    needs: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set PR_TAG
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_TAG=pr-${GITHUB_HEAD_REF//\//-}" >> $GITHUB_ENV

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # main → latest + YYYYMMDD
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

            # always: short SHA
            type=sha,format=short,prefix=sha-

            # only for PRs
            type=raw,value=${{ env.PR_TAG }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dev-build
          labels: ${{ steps.meta.outputs.labels }}

      - name: Split into content-based layers
        run: |
          docker run --rm --mount type=image,src=dev-build,destination=/chunkah -v "$RUNNER_TEMP:/out" \
            -e CHUNKAH_CONFIG_STR="$(docker inspect dev-build)" -e SOURCE_DATE_EPOCH=0 \
            quay.io/coreos/chunkah:v0.7.1 build --compressed --max-layers 128 --output oci:/out/dev

      - name: Push
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            skopeo copy --preserve-digests --digestfile "$RUNNER_TEMP/digest" "oci:$RUNNER_TEMP/dev" "docker://$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
